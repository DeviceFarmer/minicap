name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already bumped on the default branch, without the v prefix (e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the version is releasable
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # release/v* satisfies the version check below by construction, so
          # without this the branch could be tagged and published unmerged.
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::run this on $DEFAULT_BRANCH, not $GITHUB_REF_NAME"
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$VERSION is not a three part version like 1.1.0, with no v prefix"
            exit 1
          fi

          # Prepare release bumps package.json and Release tags what it produced,
          # so equality is the precondition here rather than an increase.
          CURRENT=$(node -p 'require("./package.json").version')
          PACKAGE=$(node -p 'require("./package.json").name')
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::package.json is at $CURRENT, so the $VERSION bump has not merged yet"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE@$VERSION is already published to npm"
            exit 1
          fi

      - name: Read the release notes back out of the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/changelog.mts --extract CHANGELOG.md "$VERSION" > notes.md
          cat notes.md

      - name: Tag and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The Makefile builds prebuilt/noarch/minicap.apk with experimental/gradlew.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Take npm to a version that can publish with OIDC
        run: npm install -g npm@^11.5.1

      # Pinned rather than the runner's preinstalled NDK, so a runner image
      # update cannot change what the published binaries are built with.
      - name: Install the NDK
        run: |
          set -euo pipefail
          # yes dies of SIGPIPE when sdkmanager exits early, which pipefail would
          # otherwise turn into a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_PATH"

      # libs/ is committed and its Makefile rule has no prerequisites, so make
      # alone would copy those old binaries instead of building from source.
      - name: Build the binaries
        run: ndk-build

      # npm 7 and later no longer run the prepublish script on publish.
      - name: Build
        run: make

      # The list comes from the prerequisites of the Makefile's prebuilt target,
      # which already enumerates every binary, library and the apk per ABI.
      - name: Check the tarball has every prebuilt file
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            var fs = require("fs")
            var files = require(process.argv[1])[0].files.map(function(f) { return f.path })
            var lines = fs.readFileSync("Makefile", "utf8").split("\n")
            var start = lines.indexOf("prebuilt: \\")
            var expected = []
            for (var i = start + 1; start >= 0 && i < lines.length; i++) {
              var line = lines[i].replace(/\\$/, "").trim()
              if (!line) {
                break
              }
              expected.push(line)
            }
            if (expected.indexOf("prebuilt/noarch/minicap.apk") < 0) {
              console.error("::error::could not read the prebuilt target from the Makefile")
              process.exit(1)
            }
            var missing = expected.filter(function(path) { return files.indexOf(path) < 0 })
            console.log(files.join("\n"))
            console.log("expected " + expected.length + " prebuilt files")
            if (missing.length) {
              console.error("::error::missing from the tarball: " + missing.join(", "))
              process.exit(1)
            }
          ' "$RUNNER_TEMP/pack.json"

      - name: Publish
        run: npm publish --access public
