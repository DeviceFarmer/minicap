name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The Makefile builds prebuilt/noarch/minicap.apk with apk/gradlew.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Same pin as release.yml, so CI builds what gets published.
      - name: Install the NDK
        run: |
          set -euo pipefail
          # yes dies of SIGPIPE when sdkmanager exits early, which pipefail would
          # otherwise turn into a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_PATH"

      # libs/ is committed and its Makefile rule has no prerequisites, so make
      # alone would copy those old binaries instead of building from source.
      - name: Build the binaries
        run: ndk-build

      - name: Build
        run: make

      - name: Test the apk
        run: apk/gradlew -p apk test
