version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: gradle
  directory: "/apk"
  schedule:
    interval: weekly
  groups:
    gradle:
      patterns: ["*"]
