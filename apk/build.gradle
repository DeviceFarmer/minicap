buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        // AGP 9 compiles Kotlin itself; this pins the Kotlin version it uses.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
