plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'io.devicefarmer.minicap'

    defaultConfig {
        applicationId "io.devicefarmer.minicap"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 3
        versionName "0.8"
    }

    buildTypes {
        release {
            // Run with app_process from CLASSPATH, never installed, so the apk
            // needs no signature and the code no shrinking.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // The app is never installed, so release-blocking lint checks such as the store's
        // target SDK rules don't apply.
        checkReleaseBuilds false
    }
}

base {
    archivesName = "minicap"
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.github.tony19:logback-android:3.0.0'
}
